apiVersion: v2
name: wso2-amp-observability-extension
description: A Helm chart to add Tracing functionality for the Agent Management Platform, by Deploying and Configuring the Agent Manager Observer.
type: application
version: 0.0.0-dev
appVersion: "0.0.0-dev"

keywords:
  - wso2
  - ai
  - agent-management
  - ai-agents
  - observability

maintainers:
  - name: WSO2
    url: https://wso2.com

dependencies:
  # Score store Postgres: installed with scoreStore.enabled unless
  # scoreStore.postgresql.enabled is false (external mode).
  - name: postgresql
    alias: scoreStorePostgresql
    version: 18.1.13
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: scoreStore.postgresql.enabled,scoreStore.enabled
