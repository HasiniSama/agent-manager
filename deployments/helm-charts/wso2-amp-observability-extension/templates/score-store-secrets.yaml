{{- if include "amp-observability-extension.scoreStore.bundled" . }}
{{- $secrets := list (include "amp-observability-extension.scoreStore.adminSecret" .) (include "amp-observability-extension.scoreStore.writerSecret" .) (include "amp-observability-extension.scoreStore.readerSecret" .) }}
{{- range $i, $name := $secrets }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name | default dict }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "amp-observability-extension.labels" $ | nindent 4 }}
  {{- if eq $i 0 }}
  annotations:
    # The data volume keeps this password after an uninstall, so the Secret stays too.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  # Generated once; an upgrade keeps the stored value.
  password: {{ dig "data" "password" (randAlphaNum 32 | b64enc) $existing | quote }}
{{- end }}
{{- end }}
