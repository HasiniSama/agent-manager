{{- if and (include "amp-observability-extension.scoreWriter.enabled" .) .Values.scoreWriter.ocIngress.enabled }}
# Routes scores.<domain> to the publish port only; the internal port is never routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-scores
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amp-observability-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: score-writer
spec:
  hostnames:
    - {{ .Values.scoreWriter.ocIngress.hostname }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.scoreWriter.ocIngress.gatewayName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/publisher/
      timeouts:
        request: {{ .Values.scoreWriter.ocIngress.requestTimeout | default "60s" }}
      backendRefs:
        - group: ""
          kind: Service
          name: amp-score-writer
          port: {{ .Values.scoreWriter.publishPort }}
          weight: 1
---
# The gateway speaks TLS to the writer and verifies its certificate.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: amp-score-writer-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amp-observability-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: score-writer
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: amp-score-writer
  tls:
    secretRef:
      name: amp-score-writer-gateway-tls
    sni: amp-score-writer.{{ .Release.Namespace }}.svc
    verifySubjectAltNames:
      - amp-score-writer.{{ .Release.Namespace }}.svc
{{- end }}
