{{- if .Values.networkPolicy.evaluationJob.enabled }}
{{- $evalJobNamespace := .Values.networkPolicy.evaluationJob.namespace | default (printf "workflows-%s" (.Values.ampEvaluation.workflowNamespace | default "default")) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amp-evaluation-job-egress
  namespace: {{ $evalJobNamespace }}
  labels:
{{- include "amp-evaluation-extension.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: amp-monitor
      app.kubernetes.io/component: evaluation-job
  policyTypes: [Egress]
  egress:
    # Matched post-DNAT: every rule names the backing pod's address and containerPort, not the Service's.

    # Scoped to the cluster DNS workload, not left open — this pod runs untrusted code.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.evaluationJob.dns.namespace }}
          podSelector:
            matchLabels:
              {{ .Values.networkPolicy.evaluationJob.dns.podLabel.key }}: {{ .Values.networkPolicy.evaluationJob.dns.podLabel.value }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # amp-observer (traces-observer-service) — fetch trace data to evaluate.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.evaluationJob.observer.namespace }}
      ports:
        {{- range .Values.networkPolicy.evaluationJob.observer.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}

    # amp-thunder IDP — mints the token used to call amp-observer and amp-api below.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.evaluationJob.idp.namespace }}
      ports:
        {{- range .Values.networkPolicy.evaluationJob.idp.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}

    # agent-manager-service publisher endpoint (amp-api) — publish evaluation scores.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.evaluationJob.publisher.namespace }}
      ports:
        {{- range .Values.networkPolicy.evaluationJob.publisher.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}

    {{- if .Values.ampEvaluation.scoreWriter.endpoint }}
    {{- with .Values.networkPolicy.evaluationJob.scoreWriter }}
    # amp-score-writer's publish port, or the gateway in front of it — publish scores to the score store.
    - to:
        {{- if .cidr }}
        - ipBlock:
            cidr: {{ .cidr }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
        {{- end }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- end }}

    # LLM gateway for llm_judge evaluators — unconditional since NetworkPolicy can't scope by workflow.
    # Two selectors, because the gateway's namespace is a deployment choice: the
    # per-org-env namespaces created by setup-gateway.sh / add-environment.sh carry the
    # label, while an install using the gateway chart's own apiGateway.namespace default
    # does not, and would otherwise be denied.
    - to:
        - namespaceSelector:
            matchLabels:
              amp.wso2.com/api-platform-gateway: "true"
        {{- with .Values.networkPolicy.evaluationJob.llmGateway.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.evaluationJob.llmGateway.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}

    {{- with .Values.networkPolicy.evaluationJob.devEgress }}
    {{- if and .cidr .ports }}
    # Local-dev only: agent-manager-service and the gateway are reached over the node network,
    # so namespaceSelector can't match them.
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- end }}

    {{- with .Values.networkPolicy.evaluationJob.apiServer }}
    {{- $cidrs := without (.cidrs | default list) "" nil }}
    {{- if and $cidrs .ports }}
    # wait reports WorkflowTaskResults here; no pod backs the API server, so ipBlock.
    - to:
        {{- range $cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
